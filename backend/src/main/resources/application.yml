server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
spring:
  application:
    name: guangyingyun-workbench
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/workbench;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 105MB
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  storage: ${STORAGE_PATH:./data/media}
  bootstrap:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:change-me-local}
  ai:
    mode: ${AI_MODE:local}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  video:
    enabled: ${VIDEO_API_ENABLED:false}
    base-url: ${VIDEO_API_BASE_URL:https://api.openai.com/v1}
    api-key: ${VIDEO_API_KEY:${AI_API_KEY:}}
    model: ${VIDEO_API_MODEL:seedance-2.5-m2}
    size: ${VIDEO_API_SIZE:720x1280}
    poll-delay: ${VIDEO_API_POLL_DELAY:10000}
  ffmpeg: ${FFMPEG_PATH:ffmpeg}
  oss:
    bucket: ${OSS_BUCKET:${XINLIU_OSS_BUCKET:}}
    endpoint: ${OSS_ENDPOINT:${XINLIU_OSS_ENDPOINT:}}
    access-key-id: ${OSS_ACCESS_KEY_ID:${XINLIU_OSS_ACCESS_KEY_ID:}}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:${XINLIU_OSS_ACCESS_KEY_SECRET:}}
  # 投放表格导入：每个字段认哪些表头（逗号分隔，不分大小写，忽略空格、横线、下划线和括号里的单位）。
  # 默认按千川「素材分析」报表预估；拿到真实报表后改这里就行，不用改代码。没写的字段用代码里的默认值。
  performance-import:
    columns:
      ad-name: 素材名称,投放用名,素材名,视频名称,创意名称,素材标题,视频标题
      material-id: 素材ID,素材编号,创意ID,素材id
      code: 视频编号,编号
      date: 日期,时间,统计日期,投放日期,日期范围
      date-from: 开始日期,起始日期
      date-to: 结束日期,截止日期
      cost: 消耗,花费,总消耗,消耗金额
      gmv: 成交金额,支付金额,总成交金额,整体成交金额,gmv
      orders: 成交订单数,成交单数,成交订单,订单数,成交量,支付订单数
      roi: 支付roi,投产比,roi,消耗回报率,整体支付roi
      refund-gmv: 退款金额,退款成交金额
      refund-orders: 退款订单数,退款订单,退款单数
      refund-rate-1h: 1小时退款率,1h退款率,一小时退款率
      coupon: 智能优惠券金额,智能优惠券,优惠券金额
  # 投放建议每天扫描的时间（北京时间，cron 格式；设成 "-" 就不扫，导入完成后仍会扫）
  suggestions:
    cron: ${SUGGESTIONS_CRON:0 30 7 * * *}
