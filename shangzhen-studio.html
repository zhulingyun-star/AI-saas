<script>
'use strict';
const storageKey='shangzhen-v2';
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',folder:'<path d="M3 7V5h7l2 2h9v13H3V7z"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',chart:'<path d="M4 3v17h17M8 16v-5M13 16V7M18 16V4"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',upload:'<path d="M12 16V3m-4 4 4-4 4 4M4 15v6h16v-6"/>',play:'<path d="m9 5 10 7-10 7V5z"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>',settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/>',shield:'<path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6l8-3z"/><path d="m8 12 3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',book:'<path d="M12 5c-4-2-7-2-10-1v15c4-1 7-1 10 1 3-2 6-2 10-1V4c-3-1-6-1-10 1zm0 0v15"/>',download:'<path d="M12 3v13m-4-4 4 4 4-4M4 16v5h16v-5"/>',link:'<path d="m10 7 2-2a5 5 0 0 1 7 7l-2 2M14 17l-2 2a5 5 0 0 1-7-7l2-2M8 16l8-8"/>',bolt:'<path d="m13 2-8 12h7l-1 8 8-12h-7l1-8z"/>',file:'<path d="M5 3h9l5 5v13H5V3zM14 3v6h5M8 14h8M8 17h6"/>',back:'<path d="m14 5-7 7 7 7"/>'};
const icon=name=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.grid}</svg>`;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const logo=()=>`<a class="logo" href="#website" aria-label="光影云官网"><i class="logomark">${icon('film')}</i><span>光影云<span class="wordmark-sub">电商内容工作台</span></span></a>`;
function artwork(kind='coat',tone='#b49c78',scene=0){let shape='';if(kind==='coat')shape=`<path d="m90 59 29-13 28 0 28 13 31 50-22 13-15-28-1 102H98L96 94l-15 28-22-13z" fill="${tone}" stroke="#8d816c" stroke-width="2"/><path d="m120 47 13 21 13-21M133 67v129M98 148h20m30 0h19" stroke="#8c7b62" stroke-width="2" fill="none"/><path d="m119 46 14-18 14 18" fill="#a08d70"/>`;else if(kind==='cream')shape=`<rect x="96" y="78" width="73" height="115" rx="12" fill="#e8e2d2" stroke="#bbb6a2"/><rect x="101" y="61" width="63" height="20" rx="5" fill="#a4b2a0"/><text x="132" y="129" font-size="12" font-family="serif" text-anchor="middle" fill="#5c6f57">LUMIÈRE</text><path d="M111 143h44M118 150h30" stroke="#afbaaa"/>`;else if(kind==='shoe')shape=`<path d="M78 151c19-9 18-37 34-51l24 19 33 22 40 8c9 5 12 23-2 26H74c-13-2-11-15 4-24z" fill="${tone}" stroke="#8f8678" stroke-width="2"/><path d="M79 166h132M116 116l22-3m-16 13 23-3m-12 12 24-3" stroke="#f9f5ef" stroke-width="5"/>`;else if(kind==='person')shape=`<circle cx="133" cy="56" r="23" fill="#d1b395"/><path d="M108 51c0-36 50-38 50 4-8-13-23-18-50-4z" fill="#635746"/><path d="M109 89h48l23 58-24 9v62h-51v-62l-22-9z" fill="${tone}"/><path d="M111 218v24m39-24v24" stroke="#9d8573" stroke-width="17"/>`;else if(kind==='voice')shape=Array.from({length:19},(_,index)=>`<rect x="${48+index*9}" y="${110-(index%5+1)*9}" width="4" height="${(index%5+1)*18}" rx="2" fill="#78987e"/>`).join('');else shape=`<rect x="65" y="57" width="140" height="143" rx="10" fill="#fffdf6"/><path d="M91 87h87M91 108h87M91 129h61M91 167h73" stroke="#a7b5a3" stroke-width="6"/>`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 250" role="img" aria-label="商品示意图"><rect width="270" height="250" fill="${scene%2?'#e1e7dd':'#eee9df'}"/><path d="M0 210 270 180v70H0z" fill="#d8d2c4" opacity=".35"/><ellipse cx="134" cy="207" rx="67" ry="8" fill="#96856b" opacity=".12"/>${shape}</svg>`;}
function defaultClient(name){return{name,projects:[],assets:[],jobs:[],metrics:[],rules:[{id:'natural',title:'自然光与生活场景',detail:'优先使用真实居家、通勤环境',on:true},{id:'claims',title:'商品事实需人工确认',detail:'材质、功效、认证、价格仅使用确认信息',on:true}],pending:[],members:[{name:'林川',role:'管理员',email:'lin@example.com'}],balance:2000,ledger:[],dataSource:null};}
let state;try{state=JSON.parse(localStorage.getItem(storageKey));}catch{}if(!state||!state.clients)state={activeClient:'lumi',clients:{lumi:defaultClient('轻羽 · 户外服饰'),outdoor:defaultClient('露米 · 护肤品牌')},signedIn:false,density:'standard',payment:'credits'};
const ui={assetType:'全部',assetQuery:'',selected:new Set(),assetView:'grid',projectQuery:'',projectStatus:'全部',profileTab:'规则与偏好',dataTab:'效果分析',refFrame:0,refTab:'镜头拆解',wizardStep:0,modal:null};
const root=document.querySelector('#root');const client=()=>state.clients[state.activeClient];const uid=prefix=>`${prefix}${Date.now()}${Math.floor(Math.random()*900)}`;const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{toast('本地空间不足，请减少文件或导出项目');}};const toast=message=>{const target=document.querySelector('#toast');target.textContent=message;target.classList.add('show');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>target.classList.remove('show'),2600);};
const database=new Promise(resolve=>{try{const request=indexedDB.open('shangzhen-media',1);request.onupgradeneeded=()=>request.result.createObjectStore('files');request.onsuccess=()=>resolve(request.result);request.onerror=()=>resolve(null);}catch{resolve(null);}});
async function storeFile(id,file){const db=await database;if(!db)return;return new Promise(resolve=>{const transaction=db.transaction('files','readwrite');transaction.objectStore('files').put(file,id);transaction.oncomplete=resolve;transaction.onerror=resolve;});}
const mediaUrls={};async function hydrateMedia(){const db=await database;if(!db)return;document.querySelectorAll('[data-file]').forEach(element=>{const id=element.dataset.file;if(mediaUrls[id]){element.src=mediaUrls[id];return;}const request=db.transaction('files').objectStore('files').get(id);request.onsuccess=()=>{if(request.result){mediaUrls[id]=URL.createObjectURL(request.result);element.src=mediaUrls[id];}};});}
function media(asset){if(asset.fileId)return asset.type==='音频'?`<audio data-file="${asset.fileId}" controls style="width:90%"></audio>`:asset.type==='视频'?`<video data-file="${asset.fileId}" preload="metadata" ${asset.controls?'controls':''}></video>`:asset.type==='图片'?`<img data-file="${asset.fileId}" alt="${escapeHtml(asset.name)}">`:artwork('file');return artwork(asset.kind||'coat',asset.tone||'#b6a080',asset.scene||0);}
const btn=(label,action,style='',extra='')=>`<button class="btn ${style}" data-action="${action}" ${extra}>${label}</button>`;
const head=(title,sub,actions='')=>`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div class="row wrap gap8">${actions}</div></div>`;
const empty=(title,description,actions='',compact=false)=>`<div class="empty ${compact?'compact':''}">${icon('folder')}<h3>${title}</h3><p>${description}</p><div class="row wrap gap8">${actions}</div></div>`;
function demo(){const current=client();if(current.assets.length||current.projects.length){toast('当前客户已有内容，示例不会覆盖');return;}current.assets=[{id:'a1',name:'轻羽冲锋衣 · 正面',type:'图片',kind:'coat',tags:['商品图','已确认'],brand:'轻羽',sku:'QY-03'},{id:'a2',name:'轻羽冲锋衣 · 灰色款',type:'图片',kind:'coat',tone:'#879084',tags:['商品图'],brand:'轻羽',sku:'QY-03-G'},{id:'a3',name:'通勤场景 · 参考片',type:'视频',kind:'person',tags:['参考片','待拆解'],brand:'轻羽',sku:'QY-03'},{id:'a4',name:'日常出镜 · 女模形象',type:'形象',kind:'person',tags:['品牌授权'],brand:'轻羽',sku:''},{id:'a5',name:'青年女声 · 温和口播',type:'音频',kind:'voice',tags:['音色'],brand:'轻羽',sku:''},{id:'a6',name:'轻羽品牌表达规范',type:'文档',kind:'file',tags:['品牌规范'],brand:'轻羽',sku:''},{id:'a7',name:'城市轻跑 · 鞋款',type:'图片',kind:'shoe',tags:['商品图'],brand:'轻羽',sku:'QY-09'},{id:'a8',name:'冲锋衣 · 雨天镜头',type:'视频',kind:'coat',scene:1,tags:['已交付'],brand:'轻羽',sku:'QY-03'}].map(item=>({...item,created:'2026-11-09',scope:state.activeClient}));current.projects=[{id:'p1',name:'轻羽冲锋衣 · 通勤上新',product:'轻羽冲锋衣',status:'策略确认',stage:2,mode:'共同编导',channel:'抖音',duration:15,assetIds:['a1'],kind:'coat',cost:4,created:'11-09'},{id:'p2',name:'冲锋衣 · 防风细节',product:'轻羽冲锋衣',status:'待审核',stage:4,kind:'coat',cost:102,created:'11-08'},{id:'p3',name:'城市轻跑 · 生活日常',product:'轻跑鞋',status:'已交付',stage:4,kind:'shoe',cost:88,created:'11-07'}];current.projects.forEach(project=>{project.assetIds=project.kind==='shoe'?['a7']:['a1'];project.mode='共同编导';project.renderMode='full';project.channel='抖音';project.duration=15;project.factsConfirmed=true;project.facts={name:project.product,audience:'日常通勤与轻户外人群',claims:'仅展示经品牌确认的商品特点',source:'客户确认的示例商品档案'};project.shots=defaultShots(project);});current.metrics=[{name:'天气反转 · 生活场景',spend:1260,impressions:62000,clicks:2480,orders:45,revenue:11655,date:'2026-11-09',project:'轻羽冲锋衣'},{name:'一件三场景',spend:980,impressions:58000,clicks:1740,orders:28,revenue:7252,date:'2026-11-08',project:'轻羽冲锋衣'},{name:'商品功能演示',spend:760,impressions:48000,clicks:1056,orders:17,revenue:4403,date:'2026-11-07',project:'轻羽冲锋衣'}];current.pending=[{id:'pref1',title:'前 2 秒使用情境冲突',detail:'示例：最近 5 次方案中有 4 次被采纳。确认后仅应用于此客户。'}];current.rules.push({id:'short',title:'15 秒优先，减少镜头切换',detail:'客户确认的服饰信息流制作习惯',on:true});current.dataSource='示例报表';current.isDemo=true;save();render();toast('已加载示例，可随时切回空白客户');}
function heroBoard(){return `<div class="hero-media"><div class="mini-bar"><span class="caption">轻羽 / 商品视频制作单</span><span class="caption mono">15s · 9:16</span></div><div class="board-project"><h3>冲锋衣 · 通勤天气反转</h3><span class="pill">脚本已确认</span></div><div class="hero-board"><div class="hero-product">${artwork('coat','#b09b7a')}<span class="product-take">QY-03 / 商品参考</span></div><div class="board-plan"><div class="mini-shot"><b>00:00–00:03</b><br>地铁口遇到风雨，人物戴帽继续走</div><div class="mini-shot"><b>00:03–00:08</b><br>衣领与面料近景，展示确认过的细节</div><div class="mini-shot"><b>00:08–00:15</b><br>回到通勤场景，商品清晰露出</div><div class="mini-progress"></div><div class="board-note">3 个段落 / 1 条成片 / 先确认后生成</div></div></div><div class="board-foot"><span>商品 → 方案 → 镜头 → 交付</span><span>客户：轻羽</span></div></div>`;}
function website(){return `<div class="site"><nav class="site-nav">${logo()}<div class="links"><a href="#website" data-scroll="capabilities">产品能力</a><a href="#website" data-scroll="workflow">工作流程</a><a href="#website" data-scroll="pricing">使用方式</a></div><div class="row gap8"><a class="btn ghost" href="#login">登录</a><a class="btn dark" href="#login">进入工作台 ${icon('arrow')}</a></div></nav><section class="hero"><div class="content"><div class="eyebrow">给编导、剪辑和内容负责人</div><h1>电商内容，<br>从商品到交付。</h1><p>从商品图开始，确认卖点、改好镜头，再生成一条视频。客户素材、审核意见和投放报表，都留在同一个项目里。</p><div class="row wrap"> <a class="btn dark" style="padding:13px 23px" href="#login">体验工作台 ${icon('arrow')}</a><button class="btn ghost" data-action="demo-site">查看产品示例</button></div></div>${heroBoard()}</section><div class="site-proof"><span>电商信息流</span><span>品牌商品视频</span><span>参考片拆解</span><span>漫剧内容工作流</span><span>素材与投放数据</span></div><section class="site-section" id="capabilities"><div class="eyebrow">团队怎么用</div><h2>一条视频背后的工作，放在一起。</h2><div class="grid three mt"><article class="feature"><span class="feature-index">01 / 策划</span><h3>商品先校对，方案再展开</h3><p>校对商品事实，确认一个方向，逐镜调整脚本。每一步都有清晰的状态和费用。</p></article><article class="feature"><span class="feature-index">02 / 资产</span><h3>素材按客户归档</h3><p>商品、形象、声音、案例和规则集中管理。客户确认的经验会在下次创作中被复用。</p></article><article class="feature"><span class="feature-index">03 / 复盘</span><h3>报表关联到具体素材</h3><p>用授权报表关联素材与效果，比较点击、订单和成本。下一次创作有据可依。</p></article></div></section><section class="site-section" id="workflow" style="padding-top:20px"><div class="grid two"><div><div class="eyebrow">从输入到交付</div><h2>素材、脚本、成片。<br>按顺序确认。</h2><p class="muted mt">将全流程组织成五个明确阶段。目标制作预算 6–9 分钟，按模型排队和视频长度动态估算。</p></div><div><div class="step-site"><b>01 / 素材</b><h3>上传商品图和参考片</h3><p class="caption">选择客户与平台，补充必要商品事实</p></div><div class="step-site"><b>02 / 脚本</b><h3>拆解、策划与脚本确认</h3><p class="caption">呈现镜头结构，允许人工校对与局部修改</p></div><div class="step-site"><b>03 / 交付</b><h3>按条生成，审核后交付</h3><p class="caption">一次一条；资产与反馈自动归档</p></div></div></div></section><section class="site-section" id="pricing"><h2>两种结算方式，同一套工作台。</h2><div class="grid two mt"><article class="feature"><span class="pill">平台积分</span><div class="price">按需消耗</div><p>统一结算，任务前确认费用。团队预算、客户成本与积分流水集中查看。</p><a class="btn dark mt" href="#login">体验积分模式</a></article><article class="feature"><span class="pill">自带接口</span><div class="price">软件订阅</div><p>使用自己的模型供应商接口，保留资产、编导工作流与团队管理能力。</p><a class="btn mt" href="#login">体验自带接口模式</a></article></div></section><footer class="footer row between wrap"><span>光影云 Commerce Studio · 电商内容团队的工作台</span><span>产品交互原型 · 数据与生成均为本地演示</span></footer></div>`;}
function login(){return `<div class="login"><section class="login-art">${logo()}<div><div class="eyebrow">客户素材和项目记录</div><h1>上次改好的镜头，<br>这次接着用。</h1>${heroBoard()}</div><div class="caption">客户独立空间 / 商品素材 / 创意策略 / 团队协作</div></section><section class="login-form"><div class="login-box"><div class="demo-label mb">交互演示 · 无真实账号请求</div><h1>登录工作空间</h1><p class="muted mt" style="margin-top:8px">进入你的电商内容工作空间</p><form id="loginForm"><label class="field"><span>工作邮箱</span><input class="input" type="email" name="email" placeholder="name@company.com" required autocomplete="email"></label><label class="field"><span>密码</span><input class="input" type="password" name="password" minlength="6" placeholder="至少 6 位，演示用" required autocomplete="current-password"></label><div class="row between small mb"><label><input type="checkbox" name="remember"> 记住工作空间</label><button type="button" class="text-link" data-action="login-help">登录帮助</button></div><button class="btn dark full" type="submit">登录工作台 ${icon('arrow')}</button></form><div class="divider"></div><button class="btn full" data-action="enter-demo">直接体验，无需填写</button><p class="caption mt">此原型不会发送或保存密码；无需填写真实凭据。</p><a class="text-link" href="#website" style="display:block;margin-top:22px">返回官网</a></div></section></div>`;}
const navs=[['overview','grid','工作台'],['projects','folder','项目管理'],['studio','film','内容创作'],['reference','play','参考片拆解'],['assets','folder','客户资产库'],['data','chart','数据中台'],['review','shield','审核与交付'],['preferences','book','客户规则'],['team','users','团队协作'],['settings','settings','费用与接口']];
function shell(view,html){const current=client();return `<aside class="side">${logo()}<div class="workspace"><span class="caption">团队空间</span><br><strong>曜石电商 · 内容组</strong></div>${navs.map((nav,index)=>`${index===0?'<div class="navlabel">生产</div>':index===4?'<div class="navlabel">客户与数据</div>':index===8?'<div class="navlabel">管理</div>':''}<button class="navitem ${view===nav[0]?'active':''}" data-action="nav" data-view="${nav[0]}" title="${nav[2]}">${icon(nav[1])}<span>${nav[2]}</span>${nav[0]==='review'&&current.jobs.filter(job=>job.status==='待审核').length?`<span class="count">${current.jobs.filter(job=>job.status==='待审核').length}</span>`:''}</button>`).join('')}<div class="side-foot"><div class="row"><span class="avatar">林</span><div class="user-info grow"><strong class="small">林川</strong><div class="caption">内容负责人</div></div><button class="btn ghost" data-action="logout" title="退出">${icon('arrow')}</button></div></div></aside><div class="app-main ${state.density==='compact'?'density-compact':''}"><header class="top"><div class="row gap8"><span class="caption">当前客户</span><select id="clientSelect" class="client-select" aria-label="当前客户">${Object.entries(state.clients).map(([id,value])=>`<option value="${id}" ${state.activeClient===id?'selected':''}>${escapeHtml(value.name)}</option>`).join('')}</select><span class="pill green">独立空间</span></div><div class="row"><span class="caption top-cost">${current.balance.toLocaleString()} 积分</span><span class="demo-label">本地交互原型</span><button class="btn ghost" data-action="help" aria-label="使用说明">${icon('book')}</button></div></header><main class="page content">${html}</main></div>`;}
function overview(){const current=client();if(!current.assets.length&&!current.projects.length)return `${head('开始第一条商品视频','先放入商品素材，再确认创作方案。你的内容会一直归属于当前客户。')}<div class="welcome"><div><span class="pill green">新客户工作空间</span><h2 class="mt">准备一件商品的素材</h2><p>商品事实、品牌表达和你选择的创意方向，会形成这个客户自己的工作习惯。首次创作只需完成三件事。</p><div class="row wrap mt">${btn('创建第一个项目 '+icon('arrow'),'new-project','primary')}${btn('加载示例体验','load-demo')}</div></div><div class="welcome-art">${artwork('coat')}</div></div><div class="setup"><button class="setup-item" data-action="upload-assets">${icon('upload')}<strong>01 · 放入商品素材</strong><p>商品图、使用视频与参考片集中存放，按品牌与 SKU 归档。</p></button><button class="setup-item" data-action="nav" data-view="preferences">${icon('book')}<strong>02 · 设置客户规则</strong><p>明确品牌风格、已确认事实和禁用表达，之后自动复用。</p></button><button class="setup-item" data-action="nav" data-view="data">${icon('chart')}<strong>03 · 导入效果报表</strong><p>有数据后再展示效果，素材和投放表现逐步关联。</p></button></div><div class="hint mt">项目创建后会出现在工作台，素材可在此客户的后续项目中复用</div>`;
const pending=current.jobs.filter(job=>job.status==='待审核');return `${head('工作台','查看当前客户的项目进度、待办和内容资产。',btn('新建项目 '+icon('plus'),'new-project','primary'))}<div class="kpis">${kpi('进行中项目',current.projects.filter(project=>project.status!=='已交付').length,'按当前客户统计')}${kpi('待审核素材',pending.length,'审核后归档交付')}${kpi('客户资产',current.assets.length,'包含图片、视频、声音与文档')}${kpi('本地累计费用',current.ledger.reduce((sum,item)=>sum+item.cost,0)+' 积分','演示积分，无真实消费')}</div><div class="grid two overview-columns"><div class="card"><div class="card-head"><h3>继续最近的项目</h3>${btn('全部项目','nav','ghost','data-view="projects"')}</div>${current.projects.slice(0,4).map(project=>`<div class="project-row"><div class="project-mini">${artwork(project.kind||'coat')}</div><div><h3>${escapeHtml(project.name)}</h3><p class="caption">${project.status} · ${project.created}</p></div>${btn('继续','open-project','','data-id="'+project.id+'"')}</div>`).join('')}</div><div class="card"><div class="card-head"><h3>客户经验</h3><span class="pill green">仅当前客户</span></div><div class="pad stack"><p class="small muted">${current.rules.filter(rule=>rule.on).length} 条已确认规则，${current.pending.length} 条建议待确认。</p>${current.pending.length?`<div class="notice"><strong>${escapeHtml(current.pending[0].title)}</strong><p class="caption">${escapeHtml(current.pending[0].detail)}</p></div>`:'<p class="caption">采纳方案、修改脚本和完成审核后，相关偏好可在客户规则页确认。</p>'}${btn('查看客户规则','nav','','data-view="preferences"')}</div></div></div><div class="card mt overview-activity"><div class="card-head"><h3>生产动态</h3><span class="caption">当前客户</span></div>${current.jobs.length?current.jobs.slice(0,3).map(job=>`<div class="row between pad"><div><strong>${escapeHtml(job.name)}</strong><p class="caption">${job.note} · ${job.cost} 积分</p></div><span class="pill green">${job.status}</span></div>`).join(''):empty('暂无生成任务','方案确认后，生成和交付状态会出现在这里。','',true)}</div>`;}
function kpi(label,value,foot){return `<div class="card kpi"><div class="caption">${label}</div><div class="value mono">${value}</div><div class="foot">${foot}</div></div>`;}
function projects(){const current=client();const list=current.projects.filter(project=>project.name.includes(ui.projectQuery)&&(ui.projectStatus==='全部'||project.status===ui.projectStatus));return `${head('项目管理','按客户组织商品内容，保留每次策划、修改和交付记录。',btn('新建项目 '+icon('plus'),'new-project','primary'))}<div class="toolbar"><input id="projectQuery" class="input" placeholder="搜索商品或项目" value="${escapeHtml(ui.projectQuery)}" aria-label="搜索项目"><select id="projectStatus" class="input" aria-label="项目状态">${['全部','素材准备','策略确认','待审核','已交付'].map(status=>`<option ${ui.projectStatus===status?'selected':''}>${status}</option>`).join('')}</select><span class="caption grow">${list.length} 个项目</span></div>${list.length?`<div class="project-grid">${list.map(project=>`<article class="card"><div class="project-media">${artwork(project.kind||'coat')}<span class="pill ${project.status==='已交付'?'green':'orange'}" style="position:absolute;left:13px;top:13px">${project.status}</span></div><div class="project-body"><h3>${escapeHtml(project.name)}</h3><div class="caption">${project.channel||'抖音'} · ${project.duration||15} 秒 · 负责人 林川</div><div class="progress-track"><span style="width:${Math.min(100,(project.stage+1)*20)}%"></span></div><div class="row between mt"><span class="caption">${project.cost||0} 积分 / ${project.created}</span>${btn('打开项目','open-project','','data-id="'+project.id+'"')}</div></div></article>`).join('')}</div>`:`<div class="card">${empty(current.projects.length?'没有匹配项目':'还没有项目',current.projects.length?'调整关键词或筛选条件。':'创建项目后，商品、方案、脚本和版本将在这里集中管理。',btn('新建项目','new-project','primary')+btn('加载示例','load-demo'))}</div>`}`;}
function assets(){const current=client();const list=current.assets.filter(asset=>(ui.assetType==='全部'||asset.type===ui.assetType)&&(`${asset.name} ${asset.tags.join(' ')} ${asset.sku}`).toLowerCase().includes(ui.assetQuery.toLowerCase()));const cards=list.map(asset=>`<article class="asset-card"><input class="asset-check" type="checkbox" data-select="${asset.id}" aria-label="选择 ${escapeHtml(asset.name)}" ${ui.selected.has(asset.id)?'checked':''}><div class="asset-media" data-action="asset-detail" data-id="${asset.id}">${media(asset)}<span class="pill" style="position:absolute;bottom:9px;right:9px;background:#ffffffde">${asset.type}</span></div><div class="asset-body"><h3 title="${escapeHtml(asset.name)}">${escapeHtml(asset.name)}</h3><div class="chips" style="margin-top:8px">${asset.tags.slice(0,2).map(tag=>`<span class="pill">${escapeHtml(tag)}</span>`).join('')}</div><div class="row between"><span class="muted">${escapeHtml(asset.sku||'客户共享资产')}</span><button class="text-link" data-action="asset-detail" data-id="${asset.id}">查看</button></div></div></article>`).join('');return `${head('客户资产库','一个客户一个空间。所有素材统一管理，跨项目复用。',btn('上传素材 '+icon('upload'),'upload-assets','primary'))}<div class="library"><aside class="asset-folder"><span class="caption">资产分类</span>${['全部','图片','视频','形象','音频','文档'].map(type=>`<button class="folder-btn ${ui.assetType===type?'active':''}" data-action="asset-type" data-type="${type}">${type==='全部'?'全部素材':type}<span class="caption" style="float:right">${current.assets.filter(asset=>type==='全部'||asset.type===type).length}</span></button>`).join('')}<div class="divider"></div><span class="caption">知识与经验</span><button class="folder-btn" data-action="nav" data-view="preferences">客户表达规则</button><button class="folder-btn" data-action="nav" data-view="reference">参考片拆解</button><div class="hint mt">已确认资产和规则可在创作时直接引用。</div></aside><div class="main-library"><div class="toolbar"><input id="assetQuery" class="input grow" placeholder="搜索名称、SKU、标签" value="${escapeHtml(ui.assetQuery)}" aria-label="搜索资产"><select id="assetTypeMobile" class="input" aria-label="素材类型">${['全部','图片','视频','形象','音频','文档'].map(type=>`<option ${type===ui.assetType?'selected':''}>${type}</option>`).join('')}</select><div class="row gap8" style="margin-left:auto">${btn(icon('grid'),'asset-view',ui.assetView==='grid'?'dark':'','data-mode="grid" aria-label="网格视图"')}${btn(icon('file'),'asset-view',ui.assetView==='list'?'dark':'','data-mode="list" aria-label="列表视图"')}</div></div><div class="row between mb"><span class="caption">${list.length} 项 · ${escapeHtml(current.name)}</span><button class="text-link" data-action="density">${state.density==='compact'?'标准密度':'紧凑密度'}</button></div>${list.length?(ui.assetView==='grid'?`<div class="asset-grid">${cards}</div>`:`<div class="card table-wrap"><table><thead><tr><th>选择</th><th>资产名称</th><th>类型</th><th>SKU</th><th>标签</th><th>操作</th></tr></thead><tbody>${list.map(asset=>`<tr><td><input type="checkbox" data-select="${asset.id}" aria-label="选择 ${escapeHtml(asset.name)}" ${ui.selected.has(asset.id)?'checked':''}></td><td>${escapeHtml(asset.name)}</td><td>${asset.type}</td><td>${escapeHtml(asset.sku||'—')}</td><td>${asset.tags.map(escapeHtml).join(' / ')}</td><td><button class="text-link" data-action="asset-detail" data-id="${asset.id}">详情</button></td></tr>`).join('')}</tbody></table></div>`):`<div class="card">${empty(current.assets.length?'没有找到匹配素材':'把客户的素材放在一起','图片、视频、角色、声音和品牌文档可以统一上传，按 SKU 与标签筛选。',btn('上传素材','upload-assets','primary')+btn('加载示例','load-demo'))}</div>`}${ui.selected.size?`<div class="batch"><span>已选择 ${ui.selected.size} 项</span><div class="row gap8">${btn('批量加标签','batch-tags')}${btn('导出清单','export-assets')}${btn('取消','clear-selection','ghost')}</div></div>`:''}</div></div>`;}
function currentProject(){return client().projects.find(project=>project.id===ui.projectId);}
function newProject(){modal('新建内容项目',`<form id="projectForm"><label class="field"><span>项目名称</span><input name="name" class="input" required placeholder="例如：保湿面霜 · 秋冬上新"></label><div class="grid two"><label class="field"><span>内容类型</span><select name="category" class="input"><option>电商商品视频</option><option>参考片复刻</option><option>信息流漫剧</option></select></label><label class="field"><span>平台</span><select name="channel" class="input"><option>抖音</option><option>TikTok</option><option>小红书</option></select></label></div><div class="hint">归属客户：${escapeHtml(client().name)}。首次只做一条，后续按需新增版本。</div><button type="submit" class="btn primary full mt">创建并准备素材</button></form>`);}
const steps=['商品素材','事实校对','创意方向','镜头脚本','生成交付'];
function studio(){const project=currentProject();if(!project)return `${head('内容创作','按阶段确认。每一步只展示当前需要的内容。',btn('新建项目','new-project','primary'))}<div class="card">${empty('选择项目，开始创作','上传商品图后确认商品事实，再选择一个方向。支持参考片复刻和信息流漫剧。',btn('新建项目','new-project','primary')+btn('从项目继续','nav','','data-view="projects"'))}</div>`;const step=ui.wizardStep;const picked=project.assetIds.map(id=>client().assets.find(asset=>asset.id===id)).filter(Boolean);const facts=project.facts||{};const shots=project.shots||defaultShots(project);let content='';
if(step===0)content=`<div class="card pad"><div class="row between mb"><h2>准备商品与参考素材</h2><span class="pill">${picked.length} 项已加入</span></div><p class="caption mb">先传主图或从资产库选择。参考片可以单独拆解，不必与商品图混在一起。</p>${uploadBox('projectUpload','image/*,video/*','上传商品图片或使用视频','点击选择 / 拖入文件；建议先用 1–3 张清晰商品图')}<div class="upload-preview">${picked.map(asset=>`<div class="upload-thumb">${media(asset)}<button class="remove" aria-label="移除 ${escapeHtml(asset.name)}" data-action="remove-project-asset" data-id="${asset.id}">×</button></div>`).join('')}</div><div class="row mt gap8">${btn('从客户资产库选取','pick-assets')}${btn('拆解一条参考片','nav','ghost','data-view="reference"')}</div><div class="divider"></div><label class="field"><span>补充商品信息 <span class="caption">选填</span></span><textarea class="input" id="productNote" placeholder="已有卖点、价格、受众或不希望出现的内容">${escapeHtml(project.note||'')}</textarea></label><div class="hint">本地原型会提供可编辑示例事实。真实图片识别将在模型接口接通后运行。</div></div>`;
if(step===1)content=`<div class="card pad"><div class="row between mb"><h2>确认商品事实</h2><span class="pill orange">需人工校对</span></div><p class="caption mb">照片可以判断外观，材质、功效和认证需你提供依据。以下为可编辑示例。</p><div class="grid two"><label class="field"><span>商品名称</span><input id="factName" class="input" value="${escapeHtml(facts.name||project.product||project.name)}"></label><label class="field"><span>目标人群</span><input id="factAudience" class="input" value="${escapeHtml(facts.audience||'25–35 岁日常通勤人群')}"></label></div><label class="field"><span>已确认卖点</span><textarea id="factClaims" class="input">${escapeHtml(facts.claims||'轻便、适合日常使用；具体材质及性能待品牌确认')}</textarea></label><label class="field"><span>事实来源 / 注意事项</span><input id="factSource" class="input" value="${escapeHtml(facts.source||'品牌商品详情与客户确认信息')}"></label><label class="row small"><input id="factConfirmed" type="checkbox" ${project.factsConfirmed?'checked':''}> 我已确认上述内容可用于本次创作</label></div>`;
if(step===2)content=`<div class="card pad"><div class="row between mb"><h2>选择一个创意方向</h2><span class="pill green">先确认，再展开</span></div><p class="caption mb">默认只展开一个推荐方案。参考片结构${project.reference?'已引用':'可通过拆解页引入'}，品牌事实保持使用当前商品。</p>${['生活场景中的问题与解决','商品细节与使用证明','信息流漫剧：冲突、反转、商品落点'].map((title,index)=>`<button class="choice ${project.strategy===index||(!project.strategy&&index===0)?'active':''}" data-action="strategy" data-index="${index}"><div class="row between"><strong>${title}</strong><span class="pill ${index===0?'green':''}">${index===0?'推荐方向':'备选'}</span></div><p>${['0–3 秒交代日常困扰，3–10 秒商品介入，10–15 秒留下清晰购买理由。','让观众看见使用步骤、材质细节和经过确认的商品特点。','前 3 秒建立人物冲突，中段一处反转，最后回到商品与明确行动。'][index]}</p></button>`).join('')}<details class="mt"><summary class="small" style="cursor:pointer">补充编导意图</summary><textarea class="input mt" id="directorNote" placeholder="例如：保持平实语气，减少花哨运镜">${escapeHtml(project.directorNote||'')}</textarea></details><div class="hint mt">已应用 ${client().rules.filter(rule=>rule.on).length} 条客户规则。方案采纳后可将偏好保存到此客户。</div></div>`;
if(step===3)content=`<div class="card"><div class="card-head"><div><h2>逐镜确认脚本</h2><p class="caption">15 秒 / 5 镜 · 文本可直接修改</p></div>${btn('复制完整提示词','copy-prompt')}</div><div class="pad"><div class="strip">${shots.map((shot,index)=>`<button data-action="focus-shot" data-index="${index}" aria-label="查看第 ${index+1} 镜">${artwork(project.kind||'coat','#b09d7d',index)}<span>${shot.time}</span></button>`).join('')}</div>${shots.map((shot,index)=>`<div class="shot" id="shot-${index}"><div class="shot-visual">${artwork(project.kind||'coat','#b09d7d',index)}</div><div><div class="row between"><strong>第 ${index+1} 镜 · ${shot.time}</strong><label class="caption"><input type="checkbox" data-shot-lock="${index}" ${shot.locked?'checked':''}> 锁定镜头</label></div><div class="shot-meta"><span class="pill">${shot.scale}</span><span class="pill">${shot.role}</span></div><textarea class="input" data-shot-edit="${index}" aria-label="第 ${index+1} 镜描述">${escapeHtml(shot.text)}</textarea></div></div>`).join('')}<details class="mt"><summary class="small">查看完整模型提示词</summary><pre style="white-space:pre-wrap;font:12px/1.8 inherit;background:#f7f8f6;padding:16px;border-radius:8px;margin-top:12px">${escapeHtml(promptFor(project))}</pre></details></div></div>`;
if(step===4)content=`<div class="card pad"><h2>确认本次生成</h2><p class="caption mt">脚本和参考图已准备好。默认只生成一条；任务参数与费用在提交前确认。</p><div class="grid two mt"><label class="field"><span>视频模型</span><select class="input" id="renderModel"><option ${project.model!=='客户自带供应商'?'selected':''}>Seedance 2.5</option><option ${project.model==='客户自带供应商'?'selected':''}>客户自带供应商</option></select></label><label class="field"><span>交付规格</span><select class="input" id="renderSpec"><option ${project.spec!=='16:9 · 15 秒 · 720P'?'selected':''}>9:16 · 15 秒 · 720P</option><option ${project.spec==='16:9 · 15 秒 · 720P'?'selected':''}>16:9 · 15 秒 · 720P</option></select></label></div><div class="grid two"><button class="choice ${project.renderMode!=='full'?'active':''}" data-action="render-mode" data-mode="sample"><strong>先验证 5 秒样片</strong><p>确认商品与人物一致性 · 演示 30 积分</p></button><button class="choice ${project.renderMode==='full'?'active':''}" data-action="render-mode" data-mode="full"><strong>生成 15 秒整片</strong><p>一条成片 · 演示 90 积分</p></button></div><div class="hint">流程目标：识别 30 秒 + 策划 40 秒 + 确认约 2 分钟 + 生成 3–6 分钟。实际生成速度以供应商队列为准。</div><div class="row between mt"><label class="small"><input type="checkbox" id="renderConfirm"> 我已确认脚本和本次预计费用</label>${btn('确认模拟生成','render-confirm','primary')}</div><p class="tip">本页为交互原型，仅修改本地演示积分，不发出模型请求。</p>${client().jobs.filter(job=>job.projectId===project.id).length?`<div class="divider"></div><h3>当前项目的生成记录</h3>${client().jobs.filter(job=>job.projectId===project.id).map(job=>`<div class="row between mt"><div><strong>${escapeHtml(job.name)}</strong><p class="caption">${job.note}</p></div><span class="pill green">${job.status}</span></div>`).join('')}`:''}</div>`;
return `<div class="breadcrumb"><a href="#projects">项目管理</a> / ${escapeHtml(project.name)}</div>${head(escapeHtml(project.name),'当前客户 · '+escapeHtml(client().name),btn('保存草稿','save-project')+btn('项目记录','project-history'))}<div class="card stepper">${steps.map((title,index)=>`<button class="step-button ${step===index?'current':index<step?'done':''}" data-action="step" data-index="${index}" ${index>project.stage?'disabled':''}><b>${index<step?'✓':index+1}</b>${title}</button>`).join('')}</div><div class="studio"><section>${content}<div class="row between mt">${btn(icon('back')+' 上一步','previous-step',step===0?'ghost':'',step===0?'disabled':'')}${step<4?btn(['确认素材，校对事实','确认事实，选择方向','确认方向，展开脚本','脚本确认，进入生成'][step]+' '+icon('arrow'),'next-step','primary'):btn('去审核与交付','nav','','data-view="review"')}</div></section><aside class="card pad sticky"><h3>制作约束</h3><div class="caption" style="margin:7px 0 16px">当前客户默认值，可随时调整</div><label class="field"><span>协作方式</span><select id="workMode" class="input">${['按我的想法','共同编导','全案托管'].map(mode=>`<option ${mode===project.mode?'selected':''}>${mode}</option>`).join('')}</select></label><label class="field"><span>平台</span><select id="workChannel" class="input">${['抖音','TikTok','小红书'].map(channel=>`<option ${channel===project.channel?'selected':''}>${channel}</option>`).join('')}</select></label><div class="divider"></div><div class="row between"><h3>客户规则</h3><button class="text-link" data-action="nav" data-view="preferences">查看</button></div><div class="chips mt">${client().rules.filter(rule=>rule.on).slice(0,3).map(rule=>`<span class="pill green">${escapeHtml(rule.title)}</span>`).join('')}</div><div class="divider"></div><div class="cost-row"><span>商品事实</span><span>人工校对</span></div><div class="cost-row"><span>策划 / 脚本</span><span>演示文本</span></div><div class="cost-row total"><span>下一条视频</span><span>${project.renderMode==='full'?90:30} 积分</span></div><div class="hint mt">目标 6–9 分钟<br>确认每一步；保留已满意的镜头。</div></aside></div>`;}
function uploadBox(id,accept,title,sub){return `<label class="upload" data-drop="${id}">${icon('upload')}<strong>${title}</strong><span>${sub}</span><input type="file" id="${id}" accept="${accept}" multiple></label>`;}
function defaultShots(project){if(project.reference)return refShots.map((shot,index)=>({time:shot.time,scale:shot.scale,role:shot.role,text:`当前商品：${project.facts?.name||project.product||project.name}。${project.reference.adapt?.[index]||shot.adapt}`}));if(project.strategy===2)return [{time:'00–03s',scale:'中景',role:'人物冲突',text:'人物在日常生活中遇到具体困扰，一句对话建立关系与问题。'},{time:'03–06s',scale:'反打近景',role:'冲突推进',text:'第二个角色提出解决方式，保持身份和场景连续。'},{time:'06–10s',scale:'商品近景',role:'转折',text:`通过${project.facts?.name||project.product||'当前商品'}的已确认使用方式出现一次合理转折。`},{time:'10–13s',scale:'双人中景',role:'结果回收',text:'人物关系与困扰得到简短回应，商品继续保持清晰露出。'},{time:'13–15s',scale:'商品定格',role:'行动落点',text:'结束在品牌确认的商品事实和简短行动文案，不引入未证实功效。'}];return [{time:'00–03s',scale:'中景',role:'开场冲突',text:`通勤人物遇到日常小困扰，环境自然。以真实生活问题引出${project.product||'商品'}，不夸大效果。`},{time:'03–06s',scale:'近景',role:'商品介入',text:'人物拿出商品，外观、标识与已确认参考图保持一致。展示一个明确使用动作。'},{time:'06–10s',scale:'细节特写',role:'事实证明',text:'展示已确认卖点，镜头稳定，保留可看清的商品细节。具体性能不作未经证实的演示。'},{time:'10–13s',scale:'中景',role:'生活结果',text:'回到自然生活场景，人物继续行动。保持人物身份和商品一致性。'},{time:'13–15s',scale:'商品定格',role:'行动落点',text:'商品清晰露出，背景简洁。配一句简短购买理由，字幕在剪辑阶段添加。'}];}
function promptFor(project){return `项目：${project.name}\n平台：${project.channel||'抖音'}；规格：${project.spec||'9:16 · 15 秒 · 720P'}；协作方式：${project.mode||'共同编导'}；编导意图：${project.directorNote||'依据确认方向'}。\n已确认商品：${project.facts?.name||project.product||project.name}\n已确认卖点：${project.facts?.claims||'以品牌确认信息为准'}\n客户规则：${client().rules.filter(rule=>rule.on).map(rule=>rule.title).join('；')}\n${(project.shots||defaultShots(project)).map((shot,index)=>`镜头 ${index+1} / ${shot.time} / ${shot.scale}：${shot.text}`).join('\n')}\n参考片：${project.reference?'只借鉴节奏和结构，人物、台词与品牌资产按当前项目重写':'无'}\n人物、商品外观保持一致；不添加未确认功效或价格。`;}
const refShots=[{time:'00–03s',title:'开场：一件小麻烦',role:'情境钩子',scale:'中景 / 固定',text:'人物在生活场景中遇到天气变化，先交代问题，再进入商品。',audio:'环境声建立场景，口播只提出问题。',adapt:'可借鉴问题出现的时间点；具体问题按当前商品重写。'},{time:'03–06s',title:'商品进入画面',role:'解决方式',scale:'近景 / 平移',text:'人物做一个清晰的使用动作，商品第一次完整出现。',audio:'一句简单卖点，与使用动作对应。',adapt:'把原片商品替换为当前客户商品，保留动作因果关系。'},{time:'06–10s',title:'细节与证据',role:'可信理由',scale:'特写 / 稳定',text:'以一个具体细节支持卖点，避免同时展示多个复杂动作。',audio:'短句说明，可与镜头留白交替。',adapt:'只呈现经确认的产品性能，另补真实证据镜头。'},{time:'10–13s',title:'回到日常场景',role:'使用结果',scale:'中景 / 跟随',text:'人物继续出发，让商品价值回到日常生活。',audio:'音乐轻推进，减少额外解释。',adapt:'按客户的人群与场景重写，不沿用原片人物身份。'},{time:'13–15s',title:'结尾：商品与行动',role:'购买落点',scale:'定格 / 全貌',text:'商品清晰露出，留出后期字幕位置。',audio:'一句明确行动文案。',adapt:'替换品牌、价格与文案，保留简洁收尾结构。'}];
function reference(){const reference=client().reference;return `${head('参考片拆解','先看见每一镜为什么有效，再用自己的商品重新编导。',reference?btn('换一条参考片','upload-reference'):'')}<div class="grid two"><div class="card pad"><h2>参考片</h2><p class="caption mt">支持本地上传与客户视频资产；拆解结果保留来源和确认状态。</p>${reference?`<div class="frame-board mt">${reference.fileId?`<video data-file="${reference.fileId}" controls></video>`:artwork('person','#9f967f',ui.refFrame)}<span class="time">${reference.duration?reference.duration.toFixed(1)+'s':'15s · 示例'}</span></div><div class="row between mt"><strong>${escapeHtml(reference.name)}</strong><span class="pill">${reference.fileId?'已读取时长':'示例参考'}</span></div><div class="timeline">${refShots.map((shot,index)=>`<button class="${ui.refFrame===index?'active':''}" data-action="ref-frame" data-index="${index}">${shot.time}</button>`).join('')}</div>${btn('展示拆解示例','analyze-reference','primary')}${reference.analyzed?'<p class="tip">以下是可编辑的拆解演示，不是对上传视频的真实模型识别结果。</p>':''}`:`${uploadBox('referenceUpload','video/*','上传一条参考视频','展示真实视频与时长；镜头拆解当前使用演示模板')}<div class="row mt gap8">${btn('从客户资产库选择','pick-reference')}${btn('使用示例参考片','sample-reference','ghost')}</div>`}<div class="hint mt">镜头、钩子、台词、节奏与商品职责分别呈现。确认可借鉴结构后，带入项目创作。</div></div><div class="card"><div class="card-head"><h3>逐镜拆解</h3><span class="pill orange">需人工确认</span></div>${reference?.analyzed?`<div class="pad"><div class="tabs">${['镜头拆解','节奏结构','改编边界'].map(tab=>`<button class="tab ${ui.refTab===tab?'active':''}" data-action="ref-tab" data-tab="${tab}">${tab}</button>`).join('')}</div>${ui.refTab==='镜头拆解'?`<span class="pill green">${refShots[ui.refFrame].time} · ${refShots[ui.refFrame].role}</span><h2 class="mt">${refShots[ui.refFrame].title}</h2><div class="stack mt"><div class="fact"><label>景别 / 运镜</label><p>${refShots[ui.refFrame].scale}</p></div><div class="fact"><label>画面与叙事</label><p>${refShots[ui.refFrame].text}</p></div><div class="fact"><label>声音与台词结构</label><p>${refShots[ui.refFrame].audio}</p></div><div class="fact"><label>当前商品如何改编</label><textarea class="input" id="refAdapt">${escapeHtml(reference.adapt?.[ui.refFrame]||refShots[ui.refFrame].adapt)}</textarea></div></div>`:ui.refTab==='节奏结构'?`<div class="stack">${refShots.map(shot=>`<div class="row between fact"><span>${shot.time}</span><strong>${shot.role}</strong></div>`).join('')}<div class="hint">参考结构为问题 → 介入 → 证据 → 结果 → 行动。镜头数量可减少，节奏按商品复杂度调整。</div></div>`:`<div class="stack"><div class="fact"><label>可以借鉴</label><p>开场位置、镜头时长、信息顺序、声音与画面的配合。</p></div><div class="fact"><label>需要重写</label><p>人物身份、原片台词、品牌标识、价格、功效和所有当前客户不拥有的资产。</p></div></div>`}<div class="row mt wrap">${btn('保存本镜改编','save-ref')}${btn('带入内容项目','use-reference','primary')}</div></div>`:empty('拆解后，在这里看细节','每一镜展示时间、叙事作用、视听结构和商品改编建议。','',true)}</div></div>`;}
const sums=rows=>rows.reduce((total,item)=>{for(const key of ['spend','impressions','clicks','orders','revenue'])total[key]+=Number(item[key])||0;return total;},{spend:0,impressions:0,clicks:0,orders:0,revenue:0});const ratio=(value,base,digits=2)=>base?(value/base).toFixed(digits):'—';
function dataPage(){const current=client();const totals=sums(current.metrics);return `${head('数据中台','统一报表口径，关联素材与投放结果。所有展示均保留数据来源。',btn('导入报表 '+icon('upload'),'import-csv','primary'))}<div class="tabs">${['效果分析','数据连接','素材关联'].map(tab=>`<button class="tab ${ui.dataTab===tab?'active':''}" data-action="data-tab" data-tab="${tab}">${tab}</button>`).join('')}</div>${ui.dataTab==='数据连接'?`<div class="grid two">${[['抖音千川','授权广告报表，按账户与素材关联'],['蝉妈妈 / 蝉魔方','客户授权导出参考素材数据'],['本地 CSV','素材名、消耗、曝光、点击、订单、成交金额']].map(source=>`<div class="card source-card"><span class="source-mark">${icon('link')}</span><div class="grow"><h3>${source[0]}</h3><p class="caption">${source[1]}</p><span class="pill mt">${source[0]==='本地 CSV'&&current.dataSource?'已导入':'未连接'}</span></div>${btn(source[0]==='本地 CSV'?'导入':'连接说明',source[0]==='本地 CSV'?'import-csv':'connector-info','','data-source="'+source[0]+'"')}</div>`).join('')}</div><div class="hint mt">原型不连接真实后台。正式版本需配置接口与授权，客户导出报表可以先投入使用。</div>`:!current.metrics.length?`<div class="card">${empty('有数据后，再看效果','导入授权报表即可计算消耗、点击率、订单成本与成交金额。空白客户不展示虚构增长数字。',btn('导入 CSV','import-csv','primary')+btn('下载模板','csv-template')+btn('加载示例','load-demo'))}</div>`:`<div class="row between mb"><span class="caption">来源：${escapeHtml(current.dataSource||'本地报表')} · ${current.metrics.length} 条记录 ${current.isDemo?'· 示例数据':''}</span>${btn('导出数据','export-data')}</div><div class="kpis">${kpi('投放消耗','¥'+totals.spend.toLocaleString(),'当前导入报表合计')}${kpi('点击率',totals.impressions?ratio(totals.clicks*100,totals.impressions)+'%':'—','总点击 / 总曝光')}${kpi('订单成本',totals.orders?'¥'+ratio(totals.spend,totals.orders):'—','总消耗 / 总订单')}${kpi('成交 ROAS',ratio(totals.revenue,totals.spend),'成交金额 / 消耗')}</div>${ui.dataTab==='素材关联'?`<div class="card pad"><h3>确认素材属于哪个项目</h3><p class="caption mb">按素材名称匹配，人工确认后保存到当前客户。</p>${current.metrics.map((item,index)=>`<div class="row between mt"><span>${escapeHtml(item.name)}</span><select class="input" style="max-width:270px" data-metric-project="${index}"><option valu function modal(title,body,large=false){ui.modal=title;document.querySelector('#overlay').innerHTML=`<div class="modal-backdrop"><section class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}"><div class="modal-header"><h2>${title}</h2><button class="close" aria-label="关闭弹窗" data-action="close-modal">×</button></div><div class="modal-body">${body}</div></section></div>`;bindForms();hydrateMedia();setTimeout(()=>document.querySelector('.modal input,.modal button')?.focus(),20);}

function bindForms(){document.querySelector('#loginForm')?.addEventListener('submit',event=>{event.preventDefault();state.signedIn=true;save();navigate('overview');});document.querySelector('#projectForm')?.addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.target);const project={id:uid('p'),name:data.get('name').trim(),product:data.get('name').trim(),category:data.get('category'),channel:data.get('channel'),mode:'共同编导',renderMode:'full',duration:15,status:'素材准备',stage:0,assetIds:[],kind:'coat',cost:0,created:'11-09'};if(ui.useRefOnCreate&&client().reference){project.reference=JSON.parse(JSON.stringify(client().reference));ui.useRefOnCreate=false;}client().projects.unshift(project);ui.projectId=project.id;ui.wizardStep=0;save();navigate('studio');});document.querySelectorAll('input[type=file]').forEach(input=>input.addEventListener('change',event=>handleFiles(event.target.id,[...event.target.files])));document.querySelectorAll('[data-drop]').forEach(zone=>{zone.addEventListener('dragover',event=>{event.preventDefault();zone.classList.add('dragging');});zone.addEventListener('dragleave',()=>zone.classList.remove('dragging'));zone.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('dragging');handleFiles(zone.dataset.drop,[...event.dataTransfer.files]);});});}
async function handleFiles(target,files){if(!files.length)return;const current=client();const scope=state.activeClient;if(target==='csvUpload'){await importCsv(files[0]);return;}let added=0;for(const file of files){if(file.size>80*1024*1024){toast('单文件请控制在 80MB 以内');continue;}if(target==='referenceUpload'&&!file.type.startsWith('video/')){toast('请选择视频文件');continue;}const type=file.type.startsWith('image/')?'图片':file.type.startsWith('video/')?'视频':file.type.startsWith('audio/')?'音频':'文档';const id=uid('a');const fileId=scope+'-'+id;await storeFile(fileId,file);const asset={id,fileId,name:file.name,type,tags:[target==='referenceUpload'?'参考片':'上传素材'],sku:'',scope,created:'2026-11-09'};current.assets.unshift(asset);if(target==='projectUpload'){currentProject().assetIds.push(id);currentProject().kind=type==='图片'?'cream':'coat';}if(target==='referenceUpload'){const reference={name:file.name,fileId,analyzed:false,duration:null};current.reference=reference;const duration=await readDuration(file);reference.duration=duration;}added++;if(target==='referenceUpload')break;}save();if(target==='assetUpload'||target==='referenceUpload')closeModal();render();toast(`已加入 ${added} 项素材，仅保存在此客户空间`);}
function readDuration(file){return new Promise(resolve=>{const video=document.createElement('video');const url=URL.createObjectURL(file);let settled=false;const done=value=>{if(settled)return;settled=true;URL.revokeObjectURL(url);resolve(value);};video.preload='metadata';video.onloadedmetadata=()=>done(Number.isFinite(video.duration)?video.duration:null);video.onerror=()=>done(null);video.src=url;setTimeout(()=>done(null),2000);});}
const download=(filename,text,type='application/json')=>{const url=URL.createObjectURL(new Blob([text],{type}));const anchor=document.createElement('a');anchor.href=url;anchor.download=filename;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let index=0;index<text.length;index++){const char=text[index];if(char==='"'){if(quoted&&text[index+1]==='"'){field+='"';index++;}else quoted=!quoted;}else if(char===','&&!quoted){row.push(field);field='';}else if((char==='\n'||char==='\r')&&!quoted){if(char==='\r'&&text[index+1]==='\n')index++;row.push(field);if(row.some(value=>value.trim()))rows.push(row);row=[];field='';}else field+=char;}if(field||row.length){row.push(field);rows.push(row);}return rows;}
async function importCsv(file){const rows=parseCsv((await file.text()).replace(/^\uFEFF/,''));const expected=['素材名','消耗','曝光','点击','订单','成交金额'];const header=rows.shift()?.map(item=>item.trim())||[];if(!expected.every(item=>header.includes(item))){toast('缺少必要列，请下载并按模板填写');return;}const get=(row,key)=>row[header.indexOf(key)]||'';const number=value=>Number(value.replace(/[¥￥,\s]/g,''));const records=rows.map(row=>({name:get(row,'素材名'),spend:number(get(row,'消耗')),impressions:number(get(row,'曝光')),clicks:number(get(row,'点击')),orders:number(get(row,'订单')),revenue:number(get(row,'成交金额')),date:get(row,'日期')}));if(!records.length||records.some(record=>!record.name||['spend','impressions','clicks','orders','revenue'].some(key=>!Number.isFinite(record[key])||record[key]<0))){toast('报表含空名称、负数或无效数值，请检查后重试');return;}client().metrics=records;client().dataSource=file.name;client().isDemo=false;save();closeModal();render();toast(`已导入 ${records.length} 条有效记录`);}
function importModal(){modal('导入投放报表',`<p class="caption mb">需要：素材名、消耗、曝光、点击、订单、成交金额；日期为选填。</p>${uploadBox('csvUpload','.csv','选择 CSV 报表','带引号、逗号与中文标题的 CSV 均可读取')}<div class="row mt">${btn('下载模板','csv-template')}</div>`);}
function nextStep(){const project=currentProject();const step=ui.wizardStep;if(step===0){if(!project.assetIds.length){toast('先上传或选择一项商品素材');return;}project.note=document.querySelector('#productNote').value;}if(step===1){if(!document.querySelector('#factConfirmed').checked){toast('请先确认商品事实');return;}project.facts={name:document.querySelector('#factName').value,audience:document.querySelector('#factAudience').value,claims:document.querySelector('#factClaims').value,source:document.querySelector('#factSource').value};project.factsConfirmed=true;}if(step===2){project.directorNote=document.querySelector('#directorNote')?.value||'';project.shots=project.shots||defaultShots(project);if(!client().pending.some(item=>item.title===`${project.mode} · 创作协作方式`))client().pending.push({id:uid('pref'),title:`${project.mode} · 创作协作方式`,detail:'来自本次方案确认。采用后会加入此客户规则，下次创作可复用。'});}project.stage=Math.max(project.stage,step+1);ui.wizardStep++;project.status=ui.wizardStep>=4?'待生成':'策略确认';save();render();}
async function simulateRender(failure=false){const project=currentProject();if(client().jobs.some(job=>job.projectId===project.id&&job.status==='生成中')){toast('此项目已有任务进行中，请等待完成');return;}const cost=project.renderMode==='full'?90:30;if(!document.querySelector('#renderConfirm')?.checked){toast('请确认脚本和费用后再提交');return;}if(state.payment==='credits'&&client().balance<cost){toast('演示积分不足，请先选择自带接口模式');return;}const current=client();const job={id:uid('j'),projectId:project.id,name:project.name+' · '+(project.renderMode==='full'?'整片':'样片')+' V'+(current.jobs.filter(item=>item.projectId===project.id).length+1),kind:project.kind,model:project.model||'Seedance 2.5',spec:project.spec||'9:16 · 15 秒 · 720P',sample:project.renderMode!=='full',cost:state.payment==='byok'?0:cost,status:'生成中',note:'本地任务演示，不包含真实模型成片',shots:JSON.parse(JSON.stringify(project.shots||defaultShots(project)))};current.jobs.unshift(job);current.balance-=job.cost;current.ledger.unshift({name:job.name,cost:job.cost,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});save();modal('正在模拟生产任务',`<div class="ticker"><i class="spin"></i><span>正在校验脚本和参考资产…</span></div><div class="progress-track mt"><span id="renderProgress" style="width:15%"></span></div><p class="caption mt">仅演示任务状态。真实接入后会显示排队、生成与回调阶段。</p>`);setTimeout(()=>{document.querySelector('#renderProgress')?.style.setProperty('width','62%');},600);setTimeout(()=>{if(failure){job.status='失败已退还';current.balance+=job.cost;current.ledger.unshift({name:job.name+' · 退还',cost:-job.cost,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});toast('模拟失败，积分已原路退还');}else{job.status='待审核';project.status='待审核';project.cost=(project.cost||0)+job.cost;toast('模拟任务完成，可查看分镜并审核');}save();navigate('review');},1700);}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const id=target.dataset.id;const current=client();const project=currentProject();switch(action){case'nav':navigate(target.dataset.view);break;case'close-modal':closeModal();break;case'enter-demo':state.signedIn=true;save();navigate('overview');break;case'demo-site':state.signedIn=true;demo();navigate('overview');break;case'load-demo':demo();break;case'logout':navigate('login');break;case'new-project':newProject();break;case'open-project':ui.projectId=id;ui.wizardStep=current.projects.find(item=>item.id===id).stage;ui.wizardStep=Math.min(4,ui.wizardStep);navigate('studio');break;case'upload-assets':modal('上传客户素材',`<p class="caption mb">素材归属于 ${escapeHtml(current.name)}，可跨此客户的项目复用。</p>${uploadBox('assetUpload','image/*,video/*,audio/*,.pdf,.txt,.docx','选择或拖入素材','一次支持多个文件；本地保存与预览')}`);break;case'asset-type':ui.assetType=target.dataset.type;ui.selected.clear();render();break;case'asset-view':ui.assetView=target.dataset.mode;render();break;case'density':state.density=state.density==='compact'?'standard':'compact';save();render();break;case'clear-selection':ui.selected.clear();render();break;case'export-assets':download('客户素材清单.json',JSON.stringify(current.assets.filter(asset=>!ui.selected.size||ui.selected.has(asset.id)),null,2));toast('已导出所选素材元数据');break;case'batch-tags':modal('批量添加标签',`<form id="tagForm"><label class="field"><span>标签</span><input class="input" name="tag" required placeholder="例如：秋冬上新"></label><button class="btn primary full" type="submit">应用到 ${ui.selected.size} 项素材</button></form>`);document.querySelector('#tagForm').onsubmit=event=>{event.preventDefault();const tag=new FormData(event.target).get('tag').trim();if(!tag)return;current.assets.filter(asset=>ui.selected.has(asset.id)).forEach(asset=>{if(!asset.tags.includes(tag))asset.tags.push(tag);});save();closeModal();render();toast('标签已更新');};break;case'asset-detail':{const asset=current.assets.find(item=>item.id===id);modal('资产详情',`<div class="frame-board">${media({...asset,controls:true})}</div><div class="divider"></div><form id="assetEdit"><label class="field"><span>名称</span><input class="input" name="name" required value="${escapeHtml(asset.name)}"></label><div class="grid two"><label class="field"><span>SKU</span><input class="input" name="sku" value="${escapeHtml(asset.sku)}"></label><label class="field"><span>标签，用逗号分隔</span><input class="input" name="tags" value="${escapeHtml(asset.tags.join(','))}"></label></div><div class="row between"><span class="caption">仅当前客户可复用</span><button class="btn primary" type="submit">保存修改</button></div></form>`,true);document.querySelector('#assetEdit').onsubmit=event=>{event.preventDefault();const data=new FormData(event.target);asset.name=data.get('name').trim();asset.sku=data.get('sku').trim();asset.tags=data.get('tags').split(/[,，]/).map(tag=>tag.trim()).filter(Boolean);save();closeModal();render();toast('资产信息已保存');};break;}case'pick-assets':modal('从客户资产库选择',current.assets.filter(asset=>['图片','视频'].includes(asset.type)).length?`<div class="stack">${current.assets.filter(asset=>['图片','视频'].includes(asset.type)).map(asset=>`<button class="choice" data-action="pick-asset" data-id="${asset.id}">${escapeHtml(asset.name)} <span class="pill">${asset.type}</span></button>`).join('')}</div>`:empty('资产库为空','先上传商品图，或加载示例素材。',btn('加载示例','load-demo'),true));break;case'pick-asset':if(!project.assetIds.includes(id))project.assetIds.push(id);project.kind=current.assets.find(asset=>asset.id===id).kind||project.kind;save();closeModal();render();break;case'remove-project-asset':project.assetIds=project.assetIds.filter(assetId=>assetId!==id);save();render();break;case'next-step':nextStep();break;case'previous-step':ui.wizardStep=Math.max(0,ui.wizardStep-1);render();break;case'step':ui.wizardStep=Number(target.dataset.index);render();break;case'strategy':project.strategy=Number(target.dataset.index);save();render();break;case'render-mode':project.renderMode=target.dataset.mode;save();render();break;case'save-project':if(document.querySelector('#productNote'))project.note=document.querySelector('#productNote').value;save();toast('草稿已保存在当前客户');break;case'project-history':modal('项目记录',`<div class="stack"><div class="fact"><label>当前阶段</label><p>${steps[project.stage]||'生成交付'}</p></div><div class="fact"><label>素材数 / 协作方式</label><p>${project.assetIds.length} 项 / ${project.mode}</p></div><div class="fact"><label>已确认商品与脚本</label><p>${project.factsConfirmed?'商品已校对':'商品待校对'} / ${project.shots?.length||0} 镜</p></div>${btn('导出项目','export-project')}</div>`);break;case'export-project':download('创作项目.json',JSON.stringify(project,null,2));break;case'copy-prompt':{const text=promptFor(project);if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('完整提示词已复制')).catch(()=>modal('完整提示词',`<textarea class="input" style="height:330px">${escapeHtml(text)}</textarea>`));else modal('完整提示词',`<textarea class="input" style="height:330px">${escapeHtml(text)}</textarea>`);break;}case'focus-shot':document.querySelector('#shot-'+target.dataset.index)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});break;case'render-confirm':simulateRender();break;case'sample-reference':current.reference={name:'通勤场景 · 15 秒演示参考片',analyzed:false,duration:15};save();render();break;case'upload-reference':modal('上传参考片',uploadBox('referenceUpload','video/*','选择参考片','只读取本地视频时长，拆解展示为演示模板'));break;case'pick-reference':modal('选择参考视频',current.assets.filter(asset=>asset.type==='视频').length?`<div class="stack">${current.assets.filter(asset=>asset.type==='视频').map(asset=>btn(escapeHtml(asset.name),'pick-ref-asset','','data-id="'+asset.id+'"')).join('')}</div>`:empty('暂无视频素材','上传参考片，或使用示例体验。',btn('使用示例','sample-reference'),true));break;case'pick-ref-asset':{const asset=current.assets.find(item=>item.id===id);current.reference={name:asset.name,fileId:asset.fileId||null,duration:15,analyzed:false};save();closeModal();render();break;}case'analyze-reference':current.reference.analyzed=true;ui.refFrame=0;save();render();toast('已展开 5 镜拆解演示，可逐镜调整');break;case'ref-frame':if(document.querySelector('#refAdapt')){current.reference.adapt=current.reference.adapt||{};current.reference.adapt[ui.refFrame]=document.querySelector('#refAdapt').value;save();}ui.refFrame=Number(target.dataset.index);render();break;case'ref-tab':ui.refTab=target.dataset.tab;render();break;case'save-ref':current.reference.adapt=current.reference.adapt||{};current.reference.adapt[ui.refFrame]=document.querySelector('#refAdapt')?.value||refShots[ui.refFrame].adapt;save();toast('本镜改编已保存，仅用于当前客户');break;case'use-reference':if(!project){newProject();ui.useRefOnCreate=true;}else{project.reference=JSON.parse(JSON.stringify(current.reference));project.shots=defaultShots(project).map((shot,index)=>project.shots?.[index]?.locked?project.shots[index]:shot);project.strategy=0;project.stage=Math.max(project.stage,2);ui.wizardStep=2;save();navigate('studio');toast('已将参考结构带入当前项目');}break;case'data-tab':ui.dataTab=target.dataset.tab;render();break;case'import-csv':importModal();break;case'csv-template':download('千川素材报表模板.csv','\uFEFF素材名,消耗,曝光,点击,订单,成交金额,日期\n天气反转示例,100,5000,150,3,777,2026-11-09\n','text/csv;charset=utf-8');break;case'export-data':download('投放数据.json',JSON.stringify(current.metrics,null,2));break;case'connector-info':modal(target.dataset.source+'连接说明',`<div class="hint warning">当前尚未接入真实授权。</div><p class="mt small">正式版本需要客户授权的主体、账户与报表权限。可先在“本地 CSV”导入客户导出数据，保留来源并建立素材关联。</p><div class="row mt">${btn('导入本地报表','import-csv','primary')}</div>`);break;case'save-best':{const best=[...current.metrics].sort((first,second)=>second.revenue/(second.spend||1)-first.revenue/(first.spend||1))[0];if(!current.assets.some(asset=>asset.name==='案例 · '+best.name))current.assets.unshift({id:uid('a'),name:'案例 · '+best.name,type:'文档',kind:'file',tags:['效果案例','已确认'],sku:'',scope:state.activeClient,created:'2026-11-09',metrics:best});save();toast('案例已保存到当前客户资产库');break;}case'toggle-rule':{const rule=current.rules.find(item=>item.id===id);rule.on=!rule.on;save();render();break;}case'accept-pref':{const pref=current.pending.find(item=>item.id===id);current.rules.push({id:uid('r'),title:pref.title,detail:pref.detail,on:true});current.pending=current.pending.filter(item=>item.id!==id);save();render();toast('偏好已成为当前客户的创作规则');break;}case'dismiss-pref':current.pending=current.pending.filter(item=>item.id!==id);save();render();break;case'add-rule':modal('添加客户规则',`<form id="ruleForm"><label class="field"><span>规则名称</span><input class="input" name="title" required placeholder="例如：不使用夸张转场"></label><label class="field"><span>具体要求</span><textarea class="input" name="detail" required placeholder="把能直接指导创作的要求写清楚"></textarea></label><button type="submit" class="btn primary full">保存到当前客户</button></form>`);document.querySelector('#ruleForm').onsubmit=event=>{event.preventDefault();const data=new FormData(event.target);current.rules.push({id:uid('r'),title:data.get('title').trim(),detail:data.get('detail').trim(),on:true});save();closeModal();render();toast('客户规则已保存');};break;case'add-member':modal('添加演示成员',`<form id="memberForm"><label class="field"><span>姓名</span><input class="input" name="name" required></label><label class="field"><span>邮箱</span><input class="input" name="email" type="email" required></label><label class="field"><span>角色</span><select class="input" name="role"><option>编导 / 剪辑</option><option>审核人</option><option>管理员</option></select></label><button type="submit" class="btn primary full">添加到本地演示</button><p class="tip">不发送邀请邮件。</p></form>`);document.querySelector('#memberForm').onsubmit=event=>{event.preventDefault();const data=new FormData(event.target);current.members.push({name:data.get('name'),email:data.get('email'),role:data.get('role')});save();closeModal();render();toast('演示成员已加入');};break;case'payment':state.payment=target.dataset.mode;save();render();break;case'check-api':toast(document.querySelector('#providerName').value.trim()&&document.querySelector('#apiKey').value?'演示字段已填完整，尚未发起真实连接':'请填写供应商和演示密钥');break;case'export-workspace':download('客户工作空间.json',JSON.stringify(current,null,2));break;case'review-detail':{const job=current.jobs.find(item=>item.id===id);modal('素材审核 · '+escapeHtml(job.name),`<div class="hint mb">展示分镜演示。此任务没有调用视频模型，没有真实成片文件。</div><div class="strip">${job.shots.map((shot,index)=>`<button data-action="review-frame" data-index="${index}" data-id="${id}">${artwork(job.kind)}<span>${shot.time}</span></button>`).join('')}</div><div class="fact mt" id="reviewFrame"><label>${job.shots[0].time} · ${job.shots[0].scale}</label><p>${escapeHtml(job.shots[0].text)}</p></div><label class="field mt"><span>审核意见</span><textarea id="reviewNote" class="input">${escapeHtml(job.feedback||'')}</textarea></label><div class="row">${btn('保存意见','save-review','','data-id="'+id+'"')}${btn(job.sample?'确认样片':'确认交付','approve-job','primary','data-id="'+id+'"')}</div>`,true);break;}case'review-frame':{const job=current.jobs.find(item=>item.id===id);const shot=job.shots[Number(target.dataset.index)];document.querySelector('#reviewFrame').innerHTML=`<label>${shot.time} · ${shot.scale}</label><p>${escapeHtml(shot.text)}</p>`;break;}case'save-review':{const job=current.jobs.find(item=>item.id===id);job.feedback=document.querySelector('#reviewNote').value;save();toast('审核意见已保存');break;}case'continue-full':ui.projectId=current.jobs.find(item=>item.id===id).projectId;ui.wizardStep=4;currentProject().renderMode='full';save();navigate('studio');break;case'approve-job':{const job=current.jobs.find(item=>item.id===id);job.feedback=document.querySelector('#reviewNote')?.value||job.feedback||'';job.status=job.sample?'样片已确认':'已交付';const jobProject=current.projects.find(item=>item.id===job.projectId);if(jobProject)jobProject.status=job.sample?'待生成':'已交付';if(!current.assets.some(asset=>asset.jobId===id))current.assets.unshift({id:uid('a'),jobId:id,name:job.name+' · 分镜交付包',type:'文档',kind:job.kind,tags:[job.sample?'样片已确认':'已交付','分镜演示'],sku:'',scope:state.activeClient,created:'2026-11-09',shots:job.shots});save();closeModal();render();toast(job.sample?'样片已确认，可继续整片制作':'交付记录已保存，资产归档完成');break;}case'download-job':download('分镜交付包.json',JSON.stringify(current.jobs.find(item=>item.id===id),null,2));toast('已导出脚本、分镜和审核记录');break;case'login-help':modal('登录帮助','<p>当前是产品原型。你可以直接体验，或输入任意格式正确的演示邮箱和至少六位密码。</p>');break;case'help':modal('体验这套工作台',`<div class="stack"><p>新客户先创建项目、加入商品素材。事实确认后选择一个创意方向，修改逐镜脚本，再确认模拟生成。</p><p>参考片可逐镜展示拆解示例，再带入项目。资产支持上传、筛选、标签与清单导出；数据页支持真实 CSV 计算。</p><p>在顶部切换客户，检查资产和偏好独立保存。客户规则只有确认后才自动应用。</p><div class="hint">这份原型不执行真实识别、视频生成、千川连接、付费或后台权限控制。</div></div>`,true);break;}});
document.addEventListener('change',event=>{const target=event.target;const project=currentProject();if(target.id==='clientSelect'){state.activeClient=target.value;ui.projectId=null;ui.wizardStep=0;ui.selected.clear();ui.assetQuery='';save();render();}if(target.dataset.select){target.checked?ui.selected.add(target.dataset.select):ui.selected.delete(target.dataset.select);render();}if(target.id==='assetTypeMobile'){ui.assetType=target.value;render();}if(target.id==='projectStatus'){ui.projectStatus=target.value;render();}if(target.id==='workMode'){project.mode=target.value;save();}if(target.id==='workChannel'){project.channel=target.value;save();}if(target.id==='renderModel'){project.model=target.value;save();}if(target.id==='renderSpec'){project.spec=target.value;save();}if(target.dataset.shotEdit!==undefined){project.shots[Number(target.dataset.shotEdit)].text=target.value;save();}if(target.dataset.shotLock!==undefined){project.shots[Number(target.dataset.shotLock)].locked=target.checked;save();}if(target.dataset.metricProject!==undefined){client().metrics[Number(target.dataset.metricProject)].projectId=target.value;save();toast('素材与项目关联已保存');}});
document.addEventListener('input',event=>{if(event.target.id==='assetQuery'||event.target.id==='projectQuery'){const id=event.target.id;const position=event.target.selectionStart;ui[id]=event.target.value;render();const input=document.getElementById(id);input.focus();input.setSelectionRange(position,position);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Tab'&&ui.modal){const elements=[...document.querySelectorAll('.modal button,.modal input,.modal select,.modal textarea,.modal a')].filter(element=>!element.disabled);const first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
document.addEventListener('click',event=>{const scroll=event.target.closest('[data-scroll]');if(scroll){event.preventDefault();document.querySelector('#'+scroll.dataset.scroll)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}});
window.addEventListener('hashchange',()=>{closeModal();ui.selected.clear();render();window.scrollTo(0,0);});render();
</script></body></html>
